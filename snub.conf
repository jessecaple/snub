# snub settings. Restart the service after editing:
#   systemctl --user restart snub.service
#
# Uncomment a line to change it. The values shown are the defaults, tuned on
# one worn Elite Series 2. Percentages are of the stick's full travel from
# center. Run ./run.sh from a terminal to see each filter decision as it
# happens while you adjust these.

# Stick movement near center that is treated as center. Raise this if the
# stick rests slightly off center.
#DEADZONE_PERCENT=6

# How far the stick must have been pushed before a quick reversal counts as a
# possible snapback.
#STRONG_PERCENT=70

# A reversal that goes past this point is treated as deliberate and passes
# straight through. Snapback rebounds stay below it.
#COMMIT_PERCENT=80

# Minimum jump between two samples, across center, for a reversal to count as
# a fast (ballistic) crossing, and the most time those samples can be apart.
#CROSSING_PERCENT=25
#CROSSING_WINDOW_MS=24

# Slower reversals are held at center for this long before they pass.
#GATE_MS=13

# A suspected snapback that holds steady in the new direction passes after
# SNAP_PARTIAL_MS. Nothing is held longer than SNAP_HARD_MS.
#SNAP_PARTIAL_MS=35
#SNAP_HARD_MS=120

# Once the stick rests at center this long, the next movement starts fresh.
#NEUTRAL_RESET_MS=50

# Log each filter decision (1) or stay quiet (0). Defaults to 1 when run from
# a terminal and 0 as a service.
#VERBOSE=0
